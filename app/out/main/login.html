<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuChen调试 · 登录</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 20% 0%, #14161d 0%, #08090c 45%, #050507 100%);
    color: #e8ebf2;
    font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; height: 100%; padding: 34px 36px 26px; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .04em; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f7cff, #7a4ffb); font-weight: 700; font-size: 13px; color: #fff;
  }
  .brand b { font-size: 14px; font-weight: 600; }
  .brand small { color: #6b7285; font-size: 11px; letter-spacing: .18em; }
  .winbtns { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  .winbtns button {
    width: 26px; height: 26px; border: 0; border-radius: 7px; cursor: pointer;
    background: #171a22; color: #98a0b3; font-size: 13px; line-height: 1;
  }
  .winbtns button:hover { background: #212633; color: #e8ebf2; }
  h1 { margin: 30px 0 6px; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin: 0 0 22px; color: #7c8496; font-size: 12.5px; }
  label { display: block; margin: 0 0 6px; color: #9aa2b4; font-size: 12px; }
  input {
    width: 100%; padding: 11px 13px; margin-bottom: 14px;
    background: #0e1015; border: 1px solid #232838; border-radius: 9px;
    color: #e8ebf2; font-size: 13.5px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.14); }
  button.primary {
    width: 100%; margin-top: 6px; padding: 11px 13px; border: 0; border-radius: 9px;
    background: linear-gradient(135deg, #4f7cff, #6a5bfb); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 12.5px; color: #ff6b81; }
  .msg.ok { color: #3ddc97; }
  .foot { margin-top: auto; padding-top: 16px; color: #565d6e; font-size: 11.5px; display: flex; justify-content: space-between; }
  .foot a { color: #7c8496; text-decoration: none; }
  .foot a:hover { color: #a9b1c4; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <div class="brand">
        <span class="mark">Q</span>
        <span><b>曲辰调试</b><br><small>QUCHEN DEBUG</small></span>
      </div>
      <div class="winbtns">
        <button id="min" title="最小化">—</button>
        <button id="close" title="关闭">×</button>
      </div>
    </div>

    <h1>登录以继续</h1>
    <p class="sub">账号为本机曲辰套件通用账号，登录后 30 天内可离线使用。</p>

    <label for="email">邮箱</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">

    <button class="primary" id="submit">登录</button>
    <div class="msg" id="msg"></div>

    <div class="foot">
      <span>QuChen Account · 本地校验</span>
      <a href="#" id="register">注册 / 找回密码</a>
    </div>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var btn = $('submit');
  var msg = $('msg');
  var busy = false;

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = 'msg' + (ok ? ' ok' : '');
  }

  function submit() {
    if (busy) return;
    var email = ($('email').value || '').trim();
    var password = $('password').value || '';
    if (!email || !password) { setMsg('请输入邮箱与密码'); return; }
    busy = true;
    btn.disabled = true;
    btn.textContent = '登录中…';
    setMsg('');
    window.qc.login(email, password).then(function (r) {
      if (r && r.ok) {
        setMsg('登录成功，正在启动…', true);
        btn.textContent = '启动中…';
        return;
      }
      var map = {
        pending_approval: '账号待审批，请联系管理员通过后重试',
        suspended: '账号已被封禁',
        rejected: '账号申请已被拒绝',
        user_not_found: '账号不存在',
        invalid_credentials: '邮箱或密码错误',
        unreachable: '无法连接账号服务，请检查网络或服务地址',
        no_session: '登录未完成，请重试'
      };
      var code = (r && r.code) || '';
      setMsg(map[code] || (r && r.message) || '登录失败', false);
      reset();
    }).catch(function (err) {
      setMsg((err && err.message) || '登录失败', false);
      reset();
    });

    function reset() {
      busy = false;
      btn.disabled = false;
      btn.textContent = '登录';
    }
  }

  btn.addEventListener('click', submit);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  $('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('password').focus(); });
  $('min').addEventListener('click', function () { window.qc.minimize(); });
  $('close').addEventListener('click', function () { window.qc.close(); });
  $('register').addEventListener('click', function (e) {
    e.preventDefault();
    setMsg('请在浏览器打开账号服务地址（默认 http://127.0.0.1:8788/login.html）注册或重置密码', false);
  });

  window.qc.state().then(function (s) {
    if (s && s.email) $('email').value = s.email;
    $('password').focus();
  });
})();
</script>
</body>
</html>
